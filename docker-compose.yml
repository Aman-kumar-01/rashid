services:

  backend:
    image: ghcr.io/aman-kumar-01/rashid-backend:latest
    container_name: khan-baba-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5000:5000"

  frontend:
    image: ghcr.io/aman-kumar-01/rashid-frontend:latest
    container_name: khan-baba-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend